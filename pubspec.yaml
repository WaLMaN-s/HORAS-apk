name: horas
description: "HORAS - Satu Aplikasi, Satu Keluarga Orang Batak."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  clock: ^1.1.3
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.4.0
  pinput: ^7.0.0
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  permission_handler: ^13.0.2
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  archive: ^4.7.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/data/wilayah.json
    - assets/partuturan/toba.v0.json

  # Font dibundel dari Google Fonts (lisensi OFL, lihat assets/fonts/OFL-*.txt).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/PlayfairDisplay-Black.ttf
          weight: 900
